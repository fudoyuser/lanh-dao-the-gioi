<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Lãnh đạo</title>
<meta name="description" content="Trắc nghiệm về chức vụ và quê quán của lãnh đạo Việt Nam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede6; --text: #1c1b18; --muted: #6b675e;
    --line: #e1ddd2; --accent: #b3261e; --accent-soft: #fbe9e7; --gold: #a86f00;
    --ok: #1e7a3c; --ok-soft: #e3f4e8; --bad: #b3261e; --bad-soft: #fbe9e7; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141312; --surface: #1e1d1b; --surface-2: #2a2825; --text: #f0ede6; --muted: #a39e93;
      --line: #34322e; --accent: #ff7a6e; --accent-soft: #3a1f1c; --gold: #e3b04b;
      --ok: #6fd391; --ok-soft: #173322; --bad: #ff7a6e; --bad-soft: #3a1f1c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141312; --surface: #1e1d1b; --surface-2: #2a2825; --text: #f0ede6; --muted: #a39e93;
    --line: #34322e; --accent: #ff7a6e; --accent-soft: #3a1f1c; --gold: #e3b04b;
    --ok: #6fd391; --ok-soft: #173322; --bad: #ff7a6e; --bad-soft: #3a1f1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Be Vietnam Pro", system-ui, sans-serif; line-height: 1.5; }
  a { color: var(--accent); }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 28px 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font-size: clamp(1.4rem, 4vw, 1.9rem); margin: 0; letter-spacing: -0.02em; }
  .back { text-decoration: none; font-size: .92rem; white-space: nowrap; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .muted { color: var(--muted); }
  .opts { display: grid; gap: 10px; margin: 16px 0; }
  .opt-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: .92rem; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn { border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; padding: 11px 20px; border-radius: 10px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .progress { display: flex; justify-content: space-between; font-size: .88rem; color: var(--muted); margin-bottom: 8px; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .bar i { display: block; height: 100%; background: var(--gold); transition: width .3s; }
  .kind { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--gold); font-weight: 600; }
  .q { font-size: 1.2rem; font-weight: 600; margin: 6px 0 4px; }
  .answer { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; padding: 12px 14px; border-radius: 10px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .answer:hover:not(:disabled) { border-color: var(--text); }
  .answer .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: .8rem; font-weight: 600; }
  .answer:disabled { cursor: default; }
  .answer.ok { background: var(--ok-soft); border-color: var(--ok); }
  .answer.bad { background: var(--bad-soft); border-color: var(--bad); }
  .feedback { border-radius: 10px; padding: 10px 14px; background: var(--surface-2); font-size: .93rem; margin-bottom: 14px; }
  .feedback b.ok { color: var(--ok); } .feedback b.bad { color: var(--bad); }
  .score { font-size: 3rem; font-weight: 700; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .review { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 8px; }
  .review li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
  .review li.bad { border-color: var(--bad); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .best { font-size: .88rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Quiz Lãnh đạo</h1>
    <a class="back" href="./">← Tra cứu</a>
  </header>
  <main id="app" class="panel"></main>
</div>

<script src="data/vn.js"></script>
<script>
(function () {
  const D = window.LEADERS.vn;
  const app = document.getElementById("app");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (a, n) => shuffle(a).slice(0, n);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

  const people = D.people;
  const withHome = people.filter((p) => p.hometown);
  const allHomes = [...new Set(withHome.map((p) => p.hometown))];
  const withOld = people.filter((p) => p.oldProvince);
  const allOld = [...new Set(withOld.map((p) => p.oldProvince))];
  const homeText = (p) => (p.hometownDetail ? lc(p.hometownDetail) : p.hometown) + (p.oldProvince ? ` (tỉnh cũ: ${p.oldProvince})` : "");
  const mainPos = (p) => p.positions[0];
  const lc = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  const posCount = {};
  people.forEach((p) => { posCount[mainPos(p)] = (posCount[mainPos(p)] || 0) + 1; });
  const allPos = Object.keys(posCount);
  // Chỉ hỏi "Ai giữ chức X" khi chức vụ đó là duy nhất (tránh 2 đáp án đúng).
  const uniquePos = people.filter((p) => posCount[mainPos(p)] === 1);

  // Mỗi dạng câu hỏi chỉ sinh từ dữ liệu đã xác minh.
  const TYPES = {
    hometown: {
      label: "Quê quán",
      pool: () => withHome,
      make(p) {
        const wrong = pick(allHomes.filter((h) => h !== p.hometown), 3);
        return { kind: "Quê quán", text: `${p.name} quê ở đâu?`, sub: mainPos(p),
          answer: p.hometown, options: shuffle([p.hometown, ...wrong]),
          explain: `${p.name} quê ${homeText(p)}.` };
      }
    },
    position: {
      label: "Chức vụ",
      pool: () => people,
      make(p) {
        const wrong = pick(allPos.filter((x) => x !== mainPos(p)), 3);
        return { kind: "Chức vụ", text: `${p.name} hiện giữ chức vụ nào?`, sub: "",
          answer: mainPos(p), options: shuffle([mainPos(p), ...wrong]),
          explain: `${p.name}: ${p.positions.join("; ")}.` };
      }
    },
    who: {
      label: "Ai là ai",
      pool: () => uniquePos,
      make(p) {
        const wrong = pick(people.filter((x) => x.name !== p.name), 3).map((x) => x.name);
        return { kind: "Ai là ai", text: `Ai đang giữ chức: ${mainPos(p)}?`, sub: "",
          answer: p.name, options: shuffle([p.name, ...wrong]),
          explain: `Đó là ${p.name}${p.hometown ? ", quê " + p.hometown + (p.oldProvince ? ` (${p.oldProvince} cũ)` : "") : ""}.` };
      }
    },
    oldProvince: {
      label: "Tỉnh cũ",
      pool: () => withOld,
      make(p) {
        const wrong = pick(allOld.filter((h) => h !== p.oldProvince), 3);
        return { kind: "Tỉnh cũ", text: `Trước sáp nhập năm 2025, quê ${p.name} thuộc tỉnh/thành nào?`,
          sub: `Nay thuộc ${p.hometown} · ${mainPos(p)}`,
          answer: p.oldProvince, options: shuffle([p.oldProvince, ...wrong]),
          explain: `${p.name} quê ${p.oldProvince} cũ, nay thuộc ${p.hometownDetail ? lc(p.hometownDetail) : p.hometown}.` };
      }
    },
    fromWhere: {
      label: "Đồng hương",
      pool: () => withHome,
      make(p) {
        const wrong = pick(withHome.filter((x) => x.hometown !== p.hometown), 3).map((x) => x.name);
        return { kind: "Đồng hương", text: `Lãnh đạo nào dưới đây quê ở ${p.hometown}?`, sub: "",
          answer: p.name, options: shuffle([p.name, ...wrong]),
          explain: `${p.name} (${mainPos(p)}) quê ${homeText(p)}.` };
      }
    }
  };

  const settings = { types: ["hometown", "oldProvince", "position", "who", "fromWhere"], count: 10 };
  let quiz = null;

  function startScreen() {
    const best = store.get("quiz-best");
    app.innerHTML = `
      <p>Kiểm tra hiểu biết về <b>chức vụ</b> và <b>quê quán</b> của ${people.length} lãnh đạo Việt Nam.</p>
      <div class="muted">Dạng câu hỏi</div>
      <div class="opt-group" id="types">${Object.entries(TYPES).map(([k, t]) =>
        `<button class="chip" type="button" data-t="${k}" aria-pressed="${settings.types.includes(k)}">${t.label}</button>`).join("")}</div>
      <div class="muted">Số câu</div>
      <div class="opt-group" id="counts">${[5, 10, 20, 0].map((n) =>
        `<button class="chip" type="button" data-n="${n}" aria-pressed="${settings.count === n}">${n ? n + " câu" : `Tất cả (${poolSize()} câu)`}</button>`).join("")}</div>
      <div class="row" style="align-items:center">
        <button class="btn" id="go" type="button">Bắt đầu</button>
        ${best ? `<span class="best">Kỷ lục của bạn: ${esc(best)}</span>` : ""}
      </div>`;
    app.querySelector("#types").onclick = (e) => {
      const b = e.target.closest("[data-t]"); if (!b) return;
      const k = b.dataset.t, i = settings.types.indexOf(k);
      if (i >= 0) { if (settings.types.length > 1) settings.types.splice(i, 1); } else settings.types.push(k);
      startScreen();
    };
    app.querySelector("#counts").onclick = (e) => {
      const b = e.target.closest("[data-n]"); if (!b) return;
      settings.count = +b.dataset.n; startScreen();
    };
    app.querySelector("#go").onclick = start;
  }

  // Mỗi (dạng câu hỏi, người) là một câu duy nhất → "Tất cả" = ôn trọn bộ, không trùng.
  function allPairs() {
    return settings.types.flatMap((t) => TYPES[t].pool().map((p) => [t, p]));
  }
  function poolSize() { return allPairs().length; }

  function start() {
    const pairs = shuffle(allPairs());
    const chosen = settings.count ? pairs.slice(0, settings.count) : pairs;
    const qs = chosen.map(([t, p]) => TYPES[t].make(p));
    quiz = { qs, i: 0, score: 0, answers: [] };
    question();
  }

  function question() {
    const { qs, i, score } = quiz, q = qs[i];
    app.innerHTML = `
      <div class="progress"><span>Câu ${i + 1}/${qs.length}</span><span>Điểm: ${score}</span></div>
      <div class="bar"><i style="width:${(i / qs.length) * 100}%"></i></div>
      <div class="kind">${esc(q.kind)}</div>
      <div class="q">${esc(q.text)}</div>
      ${q.sub ? `<div class="muted">${esc(q.sub)}</div>` : ""}
      <div class="opts">${q.options.map((o, k) =>
        `<button class="answer" type="button" data-o="${esc(o)}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="after"></div>`;
    app.querySelector(".opts").onclick = (e) => {
      const b = e.target.closest(".answer"); if (!b || b.disabled) return;
      answer(b.dataset.o);
    };
  }

  function answer(choice) {
    const q = quiz.qs[quiz.i], right = choice === q.answer;
    if (right) quiz.score++;
    quiz.answers.push({ q, choice, right });
    app.querySelectorAll(".answer").forEach((b) => {
      b.disabled = true;
      if (b.dataset.o === q.answer) b.classList.add("ok");
      else if (b.dataset.o === choice) b.classList.add("bad");
    });
    app.querySelector(".progress span:last-child").textContent = `Điểm: ${quiz.score}`;
    const last = quiz.i === quiz.qs.length - 1;
    app.querySelector("#after").innerHTML = `
      <div class="feedback"><b class="${right ? "ok" : "bad"}">${right ? "Chính xác!" : "Chưa đúng."}</b> ${esc(q.explain)}</div>
      <button class="btn" id="next" type="button">${last ? "Xem kết quả" : "Câu tiếp →"}</button>`;
    const next = app.querySelector("#next");
    next.focus();
    next.onclick = () => { if (last) result(); else { quiz.i++; question(); } };
  }

  function result() {
    const { score, qs, answers } = quiz;
    const pct = Math.round((score / qs.length) * 100);
    const prev = store.get("quiz-best");
    const prevPct = prev ? parseInt(prev, 10) : -1;
    if (pct > prevPct) store.set("quiz-best", `${pct}% (${score}/${qs.length})`);
    const msg = pct === 100 ? "Xuất sắc! Bạn nắm rất rõ bộ máy lãnh đạo." :
      pct >= 70 ? "Rất tốt!" : pct >= 40 ? "Khá ổn, ôn thêm một chút nhé." : "Hãy xem lại trang tra cứu rồi thử lại!";
    const wrong = answers.filter((a) => !a.right);
    app.innerHTML = `
      <div class="muted">Kết quả</div>
      <div class="score">${score}/${qs.length}</div>
      <p>${esc(msg)}${pct > prevPct && prevPct >= 0 ? " <b>Kỷ lục mới!</b>" : ""}</p>
      ${wrong.length ? `<div class="muted">Các câu trả lời sai</div>
      <ul class="review">${wrong.map((a) => `<li class="bad"><b>${esc(a.q.text)}</b><br>
        Bạn chọn: ${esc(a.choice)} · Đáp án: <b>${esc(a.q.answer)}</b></li>`).join("")}</ul>` : ""}
      <div class="row">
        <button class="btn" id="again" type="button">Chơi lại</button>
        <button class="btn ghost" id="settings" type="button">Đổi cài đặt</button>
      </div>`;
    app.querySelector("#again").onclick = start;
    app.querySelector("#settings").onclick = startScreen;
  }

  startScreen();
})();
</script>
</body>
</html>
